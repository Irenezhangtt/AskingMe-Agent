<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc"><title id="title">Upload-to-price workflow</title><desc id="desc">Upload policies or screenshots, extract the evidence, review text and scope, evaluate order eligibility, and compute a cited final price.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#9bbda3" stroke-width="1.5"/></marker></defs><rect width="1400" height="410" rx="24" fill="#173f33"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}</style><text x="50" y="50" fill="#a8d7b9" font-size="12" font-weight="600" letter-spacing="2">ASKINGME / UPLOADED POLICY CALCULATOR</text><text x="50" y="105" fill="#fffefa" font-size="35" font-weight="600">Your policies. Your purchase date. Your final price.</text><rect x="50" y="150" width="236" height="167" rx="12" fill="#224c3e" stroke="#446454"/><text x="70" y="181" fill="#a8d7b9" font-size="12">01</text><text x="70" y="215" fill="#fffefa" font-size="23" font-weight="600">Upload</text><text x="70" y="253" fill="#d1dfcf" font-size="12">Documents + screenshots</text><text x="70" y="277" fill="#d1dfcf" font-size="12">Up to 8 files per request</text><path d="M291 231h20" stroke="#9bbda3" stroke-width="1.5" marker-end="url(#a)"/><rect x="316" y="150" width="236" height="167" rx="12" fill="#224c3e" stroke="#446454"/><text x="336" y="181" fill="#a8d7b9" font-size="12">02</text><text x="336" y="215" fill="#fffefa" font-size="23" font-weight="600">Read</text><text x="336" y="253" fill="#d1dfcf" font-size="12">Full text + vision extraction</text><text x="336" y="277" fill="#d1dfcf" font-size="12">Preserve conditions and limits</text><path d="M557 231h20" stroke="#9bbda3" stroke-width="1.5" marker-end="url(#a)"/><rect x="582" y="150" width="236" height="167" rx="12" fill="#224c3e" stroke="#446454"/><text x="602" y="181" fill="#a8d7b9" font-size="12">03</text><text x="602" y="215" fill="#fffefa" font-size="23" font-weight="600">Review</text><text x="602" y="253" fill="#d1dfcf" font-size="12">Confirm text, dates and tags</text><text x="602" y="277" fill="#d1dfcf" font-size="12">Unknown dates → ask first</text><path d="M823 231h20" stroke="#9bbda3" stroke-width="1.5" marker-end="url(#a)"/><rect x="848" y="150" width="236" height="167" rx="12" fill="#224c3e" stroke="#446454"/><text x="868" y="181" fill="#a8d7b9" font-size="12">04</text><text x="868" y="215" fill="#fffefa" font-size="23" font-weight="600">Check</text><text x="868" y="253" fill="#d1dfcf" font-size="12">Date gate + order eligibility</text><text x="868" y="277" fill="#d1dfcf" font-size="12">Keep conflicting rules visible</text><path d="M1089 231h20" stroke="#9bbda3" stroke-width="1.5" marker-end="url(#a)"/><rect x="1114" y="150" width="236" height="167" rx="12" fill="#224c3e" stroke="#446454"/><text x="1134" y="181" fill="#a8d7b9" font-size="12">05</text><text x="1134" y="215" fill="#fffefa" font-size="23" font-weight="600">Calculate</text><text x="1134" y="253" fill="#d1dfcf" font-size="12">Structured plan → Decimal</text><text x="1134" y="277" fill="#d1dfcf" font-size="12">Citations + auditable steps</text><text x="50" y="365" fill="#a8d7b9" font-size="13">Request-scoped evidence · No shared demo discounts · Expired policies excluded · Missing facts produce clarification</text></svg>