<text x="68" y="78" class="micro ink">ASKINGME / FINAL PRICE AI AGENT</text>
<text x="68" y="133" class="title ink">Ground the rules. Compute the price.</text>
<text x="68" y="166" class="body muted">An evidence-to-calculation workflow, orchestrated with LangGraph.</text>
<text x="68" y="219" class="micro muted">01  /  KNOWLEDGE</text><text x="390" y="219" class="micro muted">02  /  REASONING</text><text x="1010" y="219" class="micro muted">03  /  EXECUTION</text><rect x="68" y="242" width="274" height="173" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="92" y="273" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">APPROVED DOCUMENTS</text><text x="92" y="308" font-size="21" font-weight="600" fill="#173f33">Rule knowledge</text><text x="92" y="338" font-size="14" fill="#647a70">Markdown · PDF · DOCX</text><text x="92" y="362" font-size="14" fill="#647a70">Hierarchy &amp; formula integrity</text><text x="92" y="386" font-size="14" fill="#647a70">Source · version · validity</text><rect x="68" y="442" width="274" height="147" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="92" y="473" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">ELASTICSEARCH</text><text x="92" y="508" font-size="21" font-weight="600" fill="#173f33">Indexed evidence</text><text x="92" y="538" font-size="14" fill="#647a70">BM25 text + BGE vectors</text><text x="92" y="562" font-size="14" fill="#647a70">Category · event · date filters</text><rect x="390" y="242" width="570" height="104" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="414" y="273" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">REACT → FASTAPI</text><text x="414" y="308" font-size="21" font-weight="600" fill="#173f33">Question + explicit user inputs</text><rect x="390" y="376" width="268" height="175" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="414" y="407" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">RETRIEVE → FUSE</text><text x="414" y="442" font-size="21" font-weight="600" fill="#173f33">Hybrid retrieval</text><text x="414" y="472" font-size="14" fill="#647a70">Parallel BM25 + dense kNN</text><text x="414" y="496" font-size="14" fill="#647a70">Reciprocal rank fusion</text><text x="414" y="520" font-size="14" fill="#647a70">Approved evidence only</text><rect x="686" y="376" width="274" height="175" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="710" y="407" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">RERANK → SELECT</text><text x="710" y="442" font-size="21" font-weight="600" fill="#173f33">Evidence quality</text><text x="710" y="472" font-size="14" fill="#647a70">Cross-Encoder ranking</text><text x="710" y="496" font-size="14" fill="#647a70">Dynamic context budget</text><text x="710" y="520" font-size="14" fill="#647a70">Weak evidence → rewrite</text><rect x="390" y="609" width="570" height="108" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="414" y="640" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">MODEL-GROUNDED INTERPRETATION</text><text x="414" y="675" font-size="21" font-weight="600" fill="#173f33">Structured answer plan</text><text x="414" y="705" font-size="14" fill="#647a70">Calculation · explanation · clarification</text><rect x="1010" y="242" width="320" height="199" rx="16" fill="#173f33" stroke="#dbe4d9"/><text x="1034" y="273" font-size="11" font-weight="600" letter-spacing="1.7" fill="#a8d7b9">BOUNDED DECIMAL TOOL</text><text x="1034" y="308" font-size="21" font-weight="600" fill="#fff">Decimal calculation</text><text x="1034" y="338" font-size="14" fill="#c4d9ce">Validated arithmetic expression</text><text x="1034" y="362" font-size="14" fill="#c4d9ce">50-digit working precision</text><text x="1034" y="386" font-size="14" fill="#c4d9ce">Final half-up rounding</text><text x="1034" y="410" font-size="14" fill="#c4d9ce">Auditable intermediate values</text><rect x="1010" y="486" width="320" height="231" rx="16" fill="#fff" stroke="#dbe4d9"/><text x="1034" y="517" font-size="11" font-weight="600" letter-spacing="1.7" fill="#71887d">FINAL PRICE</text><text x="1034" y="552" font-size="21" font-weight="600" fill="#173f33">CNY 297.00</text><text x="1034" y="582" font-size="14" fill="#647a70">400.00 − 50.00 − 20.00</text><text x="1034" y="606" font-size="14" fill="#647a70">× 0.90 member multiplier</text><text x="1034" y="630" font-size="14" fill="#647a70">Rule citations + calculation steps</text><text x="1034" y="654" font-size="14" fill="#647a70">Missing inputs? Ask first.</text><path d="M205 415V442" class="line"/><path d="M342 508H366V464H390" class="line"/><path d="M523 346V376" class="line"/><path d="M658 462H686" class="line"/><path d="M824 551V609" class="line"/><path d="M960 660H984V335H1010" class="line"/><path d="M1170 441V486" class="line"/><path d="M820 551V578H523V551" class="line dashed"/><text x="562" y="600" class="body muted">bounded query reformulation</text><text x="68" y="663" class="micro muted">SUPPORTING SERVICES</text><text x="68" y="690" class="body muted">Redis / Chroma memory</text><text x="68" y="714" class="body muted">Monitoring &amp; stage traces</text></svg>